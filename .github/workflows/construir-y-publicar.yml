name: Construir y publicar el sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo despliegue a la vez; no se cancela el que esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Preparar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements-lock.txt

      - name: Ejecutar pruebas adversariales
        run: python -m pytest -q

      - name: Construir el libro
        run: jupyter-book build . --warningiserror

      - name: Corregir y validar el HTML publicable
        run: |
          python scripts/postprocess_html.py _build/html
          python scripts/validate_site.py _build/html

      - name: Desactivar Jekyll
        run: touch _build/html/.nojekyll

      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _build/html

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
